spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: pawcast
  datasource:
    driver-class-name: org.postgresql.Driver
    # .env로 분리해 개발자별 DB 계정이 소스에 남지 않도록 한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawcast}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    # 개발 콘솔 출력이 요청 스레드를 잠그지 않도록 SQL 전체 출력은 끈다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
petmall:
  cors:
    allowed-origins:
      - http://127.0.0.1:5174
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://localhost:5173
  jwt:
    # HS256 서명에는 32바이트 이상인 비밀키가 필수다.
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
    issuer: ${JWT_ISSUER:pawcast}

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

# 리뷰 등록 시 감성 분석은 서버 트랜잭션에서 처리하므로 기존 AI 주소 설정을 유지한다.

file:
  upload:
    path: ./uploads/images
