spring:
  application:
    name: powcast
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/powcast
    username: postgres
    password: 1004
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
petmall:
  jwt:
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    