<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAWCAST 리뷰 AI 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --brown: #6f4e37;
      --brown-dark: #4b3325;
      --cream: #fffaf3;
      --line: #eadfce;
      --green: #21875a;
      --red: #c43d3d;
      --muted: #756b62;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
      color: #2c241e;
      background: linear-gradient(145deg, #f8efe2, #fff 55%, #f4e6d4);
    }
    main { width: min(760px, calc(100% - 32px)); margin: 56px auto; }
    .card {
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid rgba(111, 78, 55, .16);
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 22px 60px rgba(75, 51, 37, .12);
    }
    .eyebrow { margin: 0 0 8px; color: var(--brown); font-size: 13px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); line-height: 1.2; }
    .description { margin: 14px 0 28px; color: var(--muted); line-height: 1.7; }
    label { display: block; margin-bottom: 10px; font-weight: 800; }
    textarea {
      width: 100%; min-height: 170px; resize: vertical; padding: 18px;
      border: 1px solid var(--line); border-radius: 16px; outline: none;
      font: inherit; line-height: 1.65; background: var(--cream);
    }
    textarea:focus { border-color: var(--brown); box-shadow: 0 0 0 4px rgba(111, 78, 55, .1); }
    .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 13px; }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    button { border: 0; border-radius: 999px; font: inherit; font-weight: 750; cursor: pointer; }
    .sample { padding: 9px 13px; color: var(--brown-dark); background: #f3e8da; }
    .sample:hover { background: #ead8c2; }
    .submit { width: 100%; padding: 15px 20px; color: #fff; background: var(--brown); }
    .submit:hover { background: var(--brown-dark); }
    .submit:disabled { cursor: wait; opacity: .6; }
    .result { display: none; margin-top: 24px; padding: 20px; border-radius: 16px; border: 1px solid; }
    .result.visible { display: block; }
    .result.success { color: #135d3c; border-color: #a9dbc4; background: #effaf4; }
    .result.blocked, .result.error { color: #8e2929; border-color: #efb5b5; background: #fff3f3; }
    .result h2 { margin: 0 0 8px; font-size: 20px; }
    .result p { margin: 6px 0; line-height: 1.55; }
    details { margin-top: 14px; }
    pre { overflow: auto; padding: 14px; border-radius: 10px; color: #e9e2dc; background: #2f2925; font-size: 12px; }
    .endpoint { margin-top: 24px; color: var(--muted); text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="eyebrow">PAWCAST REVIEW AI</p>
      <h1>리뷰 등록 전 AI 검사</h1>
      <p class="description">실제 API를 호출해 욕설 차단 여부와 긍정·부정 분석 결과를 확인합니다.</p>

      <form id="review-form">
        <label for="content">테스트할 리뷰</label>
        <textarea id="content" minlength="2" maxlength="5000" required placeholder="리뷰 내용을 입력해 주세요."></textarea>
        <div class="meta"><span>2~5,000자</span><span id="count">0 / 5,000</span></div>
        <div class="samples" aria-label="예문 선택">
          <button class="sample" type="button" data-text="배송도 빠르고 제품도 정말 좋아요. 다음에도 구매할게요!">긍정 예문</button>
          <button class="sample" type="button" data-text="배송이 늦고 포장도 찢어져 있어서 실망했습니다.">부정 예문</button>
          <button class="sample" type="button" data-text="시*발 배송을 왜 이따위로 하냐">욕설 예문</button>
          <button class="sample" type="button" data-text="시바견이 사용하기에는 크기가 조금 작아요.">과잉 차단 확인</button>
        </div>
        <button class="submit" id="submit" type="submit">AI 검사하기</button>
      </form>

      <section id="result" class="result" aria-live="polite">
        <h2 id="result-title"></h2>
        <div id="result-body"></div>
        <details>
          <summary>API 원본 응답 보기</summary>
          <pre id="raw-result"></pre>
        </details>
      </section>
      <p class="endpoint" id="endpoint">POST /api/reviews/analyze</p>
    </section>
  </main>

  <script>
    const form = document.querySelector('#review-form');
    const content = document.querySelector('#content');
    const count = document.querySelector('#count');
    const submit = document.querySelector('#submit');
    const result = document.querySelector('#result');
    const resultTitle = document.querySelector('#result-title');
    const resultBody = document.querySelector('#result-body');
    const rawResult = document.querySelector('#raw-result');
    const endpoint = document.querySelector('#endpoint');
    const isFastApiPage = ['127.0.0.1', 'localhost'].includes(location.hostname)
      && location.port === '8000';
    const apiBaseUrl = isFastApiPage ? location.origin : 'http://127.0.0.1:8000';
    const analyzeUrl = `${apiBaseUrl}/api/reviews/analyze`;
    endpoint.textContent = `POST ${analyzeUrl}`;

    function updateCount() { count.textContent = `${content.value.length.toLocaleString()} / 5,000`; }
    content.addEventListener('input', updateCount);
    document.querySelectorAll('[data-text]').forEach((button) => {
      button.addEventListener('click', () => {
        content.value = button.dataset.text;
        updateCount();
        content.focus();
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.className = 'result';
      submit.disabled = true;
      submit.textContent = '검사 중…';

      try {
        const response = await fetch(analyzeUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: content.value })
        });
        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch {
          data = { message: responseText || `HTTP ${response.status}` };
        }
        rawResult.textContent = JSON.stringify(data, null, 2);

        if (response.ok) {
          const sentimentText = data.sentiment === 'POSITIVE' ? '긍정' : '부정';
          result.className = 'result visible success';
          resultTitle.textContent = '등록 가능한 리뷰입니다';
          resultBody.innerHTML = `<p><strong>감성 결과:</strong> ${sentimentText}</p><p><strong>신뢰도:</strong> ${(data.confidence * 100).toFixed(2)}%</p>`;
        } else if (data.detail?.code === 'PROHIBITED_WORD') {
          result.className = 'result visible blocked';
          resultTitle.textContent = '리뷰를 등록할 수 없습니다';
          resultBody.textContent = data.detail.message;
        } else {
          result.className = 'result visible error';
          resultTitle.textContent = '요청을 처리하지 못했습니다';
          const errorMessage = data.detail?.message || data.detail || data.message;
          resultBody.textContent = typeof errorMessage === 'string'
            ? errorMessage
            : JSON.stringify(errorMessage);
        }
      } catch (error) {
        result.className = 'result visible error';
        resultTitle.textContent = 'AI 서버에 연결할 수 없습니다';
        resultBody.textContent = `FastAPI 서버(${apiBaseUrl})가 실행 중인지 확인해 주세요.`;
        rawResult.textContent = String(error);
      } finally {
        submit.disabled = false;
        submit.textContent = 'AI 검사하기';
      }
    });
  </script>
</body>
</html>
